<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
    <nav class="site-nav" th:fragment="nav">
        <ul>
            <li><a href="/">플랜 둘러보기</a></li>
            <li sec:authorize="isAuthenticated()"><a href="/subscriptions">내 구독 관리</a></li>
            <li sec:authorize="isAuthenticated()"><a href="/member/mypage">마이페이지</a></li>
            <li sec:authorize="!isAuthenticated()"><a href="/login">로그인</a></li>
            <li sec:authorize="!isAuthenticated()"><a href="/join">회원가입</a></li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit">로그아웃</button>
                </form>
            </li>
        </ul>
    </nav>
</body>
</html>
