<!DOCTYPE html>
<!-- 
    [프론트엔드 3] 내 구독 관리 페이지
    - 가이드라인: layout.html 상속 필수
    - 핵심 요소: 내 구독 카드 리스트, 해지 버튼, 알림 설정/상태 표시
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>내 구독 관리 - SubTrack</title>
</head>
<body>
<section class="content">
    <style>
        /* 레이아웃 구조 보정 Grid */
        .app-container {
            display: grid;
            grid-template-areas: 
                "sidebar header"
                "sidebar main"
                "sidebar footer";
            grid-template-columns: var(--sidebar-w) 1fr;
            grid-template-rows: var(--header-h) 1fr auto;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            
            --primary: #1A367E;
            --primary-dark: #142d6e;
            --primary-soft: rgba(26, 54, 126, 0.08);
            --card-shadow: 0 4px 32px rgba(26, 54, 126, 0.10);
            --radius-large: 16px;
            --radius-small: 10px;
            --bg-body: #F4F6FB;
        }
        .site-header {
            grid-area: header;
            height: var(--header-h);
        }
        .site-nav {
            grid-area: sidebar;
            width: var(--sidebar-w);
        }
        .main-content {
            grid-area: main;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--bg-body);
        }
        .site-footer {
            grid-area: footer;
        }
        
        .container {
            max-width: 1000px;
            padding: 40px 24px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 14px;
            color: #6B7A99;
        }

        /* 개별 구독 카드 (login.html 참조) */
        .subscription-item {
            background: #fff;
            border-radius: var(--radius-large);
            box-shadow: var(--card-shadow);
            border: none;
            margin-bottom: 24px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .subscription-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(26, 54, 126, 0.15);
        }
        
        .subscription-item .card-body {
            padding: 32px 28px;
        }

        .subscription-item .card-footer {
            background: #F8FAFC;
            border-top: 1.5px solid #E2E8F0;
            padding: 16px 28px;
        }

        /* 배지 스타일 */
        .badge {
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: -0.2px;
            display: inline-block;
        }
        .badge-normal {
            background: rgba(26, 54, 126, 0.08);
            color: #1A367E;
        }
        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
        }
        .badge-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
        }
        .badge-critical {
            background: #FEF2F2;
            color: #DC2626;
            border: 1.5px solid #FCA5A5;
        }

        /* 버튼 프리미엄 스타일 */
        .btn {
            font-size: 13px;
            font-weight: 700;
            padding: 9px 16px;
            border-radius: var(--radius-small);
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        
        .btn-outline-primary {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }
        .btn-outline-primary:hover {
            background: var(--primary-soft);
            transform: translateY(-1px);
        }
        
        .btn-outline-secondary {
            background: #fff;
            color: #374151;
            border: 1.5px solid #E2E8F0;
        }
        .btn-outline-secondary:hover {
            background: #F8FAFC;
            border-color: #CBD5E1;
            transform: translateY(-1px);
        }
        
        .btn-outline-danger {
            background: #fff;
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }
        .btn-outline-danger:hover {
            background: #FEF2F2;
            transform: translateY(-1px);
        }
    </style>
    <div class="container">
        <header class="page-header mb-4 d-flex justify-content-between align-items-center"> <!-- [역할] 페이지 제목 및 상단 액션 영역 -->
            <div>
                <h1>내 구독 관리</h1>
                <p class="text-muted">현재 이용 중인 구독 서비스들의 상태를 한눈에 확인하세요.</p>
            </div>
            <a href="/" class="btn btn-outline-primary">새 구독 추가</a>
        </header>

        <!-- 
            [백엔드 협의 필요]
            - Model Key: "subscriptions" (List 자료형)
        -->
        <div class="subscription-list"> <!-- [역할] 구독 중인 서비스 카드들을 나열하는 컨테이너 -->
            
            <!-- 구독 중인 서비스가 없을 경우 -->
            <div th:if="${#lists.isEmpty(subscriptions)}" class="empty-state card p-5 text-center"> <!-- [역할] 구독 데이터가 없을 때의 안내 영역 -->
                <p class="h4 mb-3">구독 중인 서비스가 없습니다.</p>
                <p class="text-muted">다양한 플랜을 둘러보고 나만의 구독 리스트를 만들어보세요!</p>
                <a href="/" class="btn btn-primary mt-3">플랜 둘러보기</a>
            </div>

            <!-- 개별 구독 카드 (반복문) -->
            <!-- s: MemberSubscription 객체 -->
            <div th:each="s : ${subscriptions}" class="subscription-item card mb-3"> <!-- [역할] 개별 구독 관리 단위 카드 -->
                <div class="card-body">
                    <div class="row align-items-center">
                        <!-- 서비스 기본 정보 -->
                        <div class="col-md-4"> <!-- [역할] 서비스 명칭 및 카테고리 정보 영역 -->
                            <!-- [백엔드 필드] s.plan.name : 서비스 이름 -->
                            <h2 class="h5 mb-1" th:text="${s.plan.name}">서비스 이름</h2>
                            <!-- [백엔드 필드] s.plan.category : 카테고리 -->
                            <span class="badge badge-normal" th:text="${s.plan.category}">카테고리</span>
                        </div>

                        <!-- 사용 현황 및 경보 상태 -->
                        <div class="col-md-4 text-center"> <!-- [역할] 현재 구독의 상태 및 위험도 표시 영역 -->
                            <!-- [백엔드 필드] s.alertLevel : 경보 단계 (NORMAL, WARNING, DANGER, CRITICAL) -->
                            <div class="status-badge mb-2">
                                <span class="badge" 
                                      th:classappend="'badge-' + ${#strings.toLowerCase(s.alertLevel)}" 
                                      th:text="${s.alertLevel}">NORMAL</span> <!-- [역할] 방치 수준 배지 -->
                            </div>
                            <!-- [백엔드 필드] s.lastUsedAt : 최근 체크인 일자 -->
                            <p class="small text-muted mb-0">
                                최근 체크인: <span th:text="${s.lastUsedAt != null ? #temporals.format(s.lastUsedAt, 'yyyy-MM-dd') : '기록 없음'}">2024-01-01</span>
                            </p>
                        </div>

                        <!-- 관리 액션 버튼 -->
                        <div class="col-md-4 text-right d-flex justify-content-end gap-2"> <!-- [역할] 관리 기능(상세, 해지) 버튼 영역 -->
                            <!-- [백엔드 API] GET /plans/{id} : 상세 페이지 이동 -->
                            <a th:href="@{/plans/{id}(id=${s.plan.id})}" class="btn btn-sm btn-outline-secondary">상세/체크인</a> <!-- [역할] 상세 데이터 확인 버튼 -->
                            
                            <!-- [백엔드 API] POST /subscriptions/cancel/{id} : s.id는 구독 PK -->
                            <form th:action="@{/subscriptions/cancel/{id}(id=${s.id})}" method="post" 
                                  onsubmit="return confirm('정말로 이 구독을 해지하시겠습니까? 해지 시 다이어리에 기록됩니다.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">구독 해지</button> <!-- [역할] 구독 중단 및 해지 다이어리 생성 버튼 -->
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- 하단 결제 예정일 안내 바 (선택적 표시) -->
                <!-- [백엔드 필드] s.dueDate : 다음 결제 예정일 -->
                <div th:if="${s.dueDate != null}" class="card-footer bg-light py-2"> <!-- [역할] 다음 결제일 안내를 위한 카드 하단 바 -->
                    <small class="text-secondary">
                        <i class="bi bi-calendar-event"></i> 다음 결제 예정일: 
                        <strong th:text="${#temporals.format(s.dueDate, 'yyyy-MM-dd')}">2024-02-01</strong>
                    </small>
                </div>
            </div>

    </div>
    
    <!-- 토스트 알림 처리 -->
    <script th:inline="javascript" th:if="${successMessage != null}">
        /*<![CDATA[*/
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof window.showToast === 'function') {
                window.showToast(/*[[${successMessage}]]*/ '작업이 완료되었습니다.');
            }
        });
        /*]]>*/
    </script>
</section>
</body>
</html>
