<!DOCTYPE html>
<!-- 
    [프론트엔드 3] 플랜 목록 페이지
    - 가이드라인: layout.html 상속 필수
    - 핵심 요소: 체크인 버튼, 30칸 히트맵, 경보 배지
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>플랜 목록 - SubTrack</title>
</head>
<body>
<section class="content">
    <style>
        /* 레이아웃 구조 보정 Grid */
        .app-container {
            display: grid;
            grid-template-areas: 
                "sidebar header"
                "sidebar main"
                "sidebar footer";
            grid-template-columns: var(--sidebar-w) 1fr;
            grid-template-rows: var(--header-h) 1fr auto;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            
            --primary: #1A367E;
            --primary-dark: #142d6e;
            --primary-soft: rgba(26, 54, 126, 0.08);
            --card-shadow: 0 4px 32px rgba(26, 54, 126, 0.10);
            --radius-large: 16px;
            --radius-small: 10px;
            --bg-body: #F4F6FB;
        }
        .site-header {
            grid-area: header;
            height: var(--header-h);
        }
        .site-nav {
            grid-area: sidebar;
            width: var(--sidebar-w);
        }
        .main-content {
            grid-area: main;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--bg-body);
        }
        .site-footer {
            grid-area: footer;
        }
        
        .container {
            max-width: 1200px;
            padding: 40px 24px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 14px;
            color: #6B7A99;
        }
        
        /* plan-grid  */
        .plan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* 카드 호버 애니메이션 및 패딩 (login.html 카드 기반) */
        .plan-card {
            background: #fff;
            border-radius: var(--radius-large);
            box-shadow: var(--card-shadow);
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .plan-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(26, 54, 126, 0.15);
        }
        .plan-card .card-body {
            padding: 32px 28px 24px;
        }

        /* 배지 스타일 */
        .badge {
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: -0.2px;
            display: inline-block;
        }
        .badge-normal {
            background: rgba(26, 54, 126, 0.08);
            color: #1A367E;
        }
        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #F59E0B;
        }
        .badge-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
        }
        .badge-critical {
            background: #FEF2F2;
            color: #DC2626;
            border: 1.5px solid #FCA5A5;
        }

        /* 히트맵 영역 */
        .heatmap-section {
            background: #F8FAFC;
            border-radius: var(--radius-small);
            padding: 16px;
            border: 1.5px solid #E2E8F0;
        }
        
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .heat-cell {
            aspect-ratio: 1/1;
            border-radius: 3px;
            background-color: #E2E8F0;
            transition: background-color 0.2s;
        }

        .heat-cell.heat-green-3 {
            background-color: var(--primary);
        }

        /* 버튼 스타일 및 애니메이션 */
        .btn {
            font-size: 14px;
            font-weight: 700;
            padding: 11px 20px;
            border-radius: var(--radius-small);
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            background: #CBD5E1;
            color: #94A3B8;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline-secondary {
            background: #fff;
            color: #374151;
            border: 1.5px solid #E2E8F0;
        }
        .btn-outline-secondary:hover {
            background: #F8FAFC;
            border-color: #CBD5E1;
            transform: translateY(-1px);
        }
        .btn-outline-secondary:active {
            transform: translateY(0);
        }
    </style>
    <div class="container">
        <header class="page-header mb-4"> <!-- [역할] 페이지 메인 제목 및 설명 영역 -->
            <h1>구독 플랜 목록</h1>
            <p>현재 구독 중인 서비스의 사용량을 관리하세요.</p>
        </header>

        <!-- 
            [백엔드 협의 필요]
            - Model Key: "plans" (List 자료형)
        -->
        <div class="plan-grid"> <!-- [역할] 플랜 카드들을 배치하는 그리드 컨테이너 -->
            <!-- plans가 비어있을 경우 처리 -->
            <div th:if="${#lists.isEmpty(plans)}" class="empty-state card p-5 text-center"> <!-- [역할] 데이터가 없을 때 표시되는 빈 화면 영역 -->
                <p>현재 구독 중인 플랜이 없습니다. 새로운 플랜을 찾아보세요!</p>
                <a href="/plans" class="btn btn-primary">플랜 둘러보기</a>
            </div>

            <!-- p: MemberSubscription 엔티티 또는 DTO 객체 -->
            <div th:each="p : ${plans}" class="plan-card card mb-3"> <!-- [역할] 개별 구독 정보를 담는 카드 단위 -->
                <div class="card-body">
                    <div class="plan-info d-flex justify-content-between align-items-start"> <!-- [역할] 카드 상단 정보(제목, 카테고리, 배지) 영역 -->
                        <div>
                            <!-- [백엔드 필드] p.plan.name : 서비스 명 (예: 넷플릭스) -->
                            <h2 class="h5 mb-1" th:text="${p.plan.name}">서비스 이름</h2> <!-- [역할] 서비스 명칭 제목 -->
                            <!-- [백엔드 필드] p.plan.category : 카테고리 (예: OTT, 음악) -->
                            <p class="text-muted small" th:text="${p.plan.category}">카테고리</p> <!-- [역할] 카테고리 텍스트 -->
                        </div>
                        
                        <!-- [백엔드 필드] p.alertLevel : 경보 단계 (NORMAL, WARNING, DANGER, CRITICAL) -->
                        <!-- 가이드라인: .badge-normal, .badge-warning 등의 클래스 사용 -->
                        <span class="badge" 
                              th:classappend="'badge-' + ${#strings.toLowerCase(p.alertLevel)}" 
                              th:text="${p.alertLevel}">NORMAL</span> <!-- [역할] 방치 경보 상태 표시 배지 -->
                    </div>
                    
                    <div class="heatmap-section my-3"> <!-- [역할] 히트맵 전체 섹션 (헤더+그리드) -->
                        <div class="heatmap-header d-flex justify-content-between mb-1"> <!-- [역할] 히트맵 상단 텍스트 및 카운트 정보 -->
                            <span class="small text-secondary">최근 30일 사용 현황</span>
                            <!-- [백엔드 필드] p.monthlyUsageCount : 최근 30일간 총 체크인 횟수 -->
                            <span class="usage-count badge badge-normal" th:text="${p.monthlyUsageCount} + '회 체크인'">0회 체크인</span> <!-- [역할] 총 체크인 횟수 표시 -->
                        </div>
                        
                        <!-- 가이드라인: .heatmap-grid 안에 30개의 .heat-box 생성 -->
                        <div class="heatmap-grid"> <!-- [역할] 30일 사용량을 보여주는 잔디(히트맵) 그리드 컨테이너 -->
                            <!-- [백엔드 필드] p.recentUsage : 30개의 Boolean 값을 가진 List/Array -->
                            <div th:each="used : ${p.recentUsage}" 
                                 class="heat-cell" 
                                 th:classappend="${used ? 'heat-green-3' : 'heat-gray'}"
                                 th:title="${used ? '사용함' : '미사용'}"> <!-- [역할] 개별 날짜의 사용 여부를 나타내는 사각형 칸 -->
                            </div>
                        </div>
                    </div>

                    <div class="plan-actions d-flex gap-2"> <!-- [역할] 하단 버튼 액션 영역 (체크인, 상세) -->
                        <!-- [백엔드 API] POST /checkin/{id} : p.id는 MemberSubscription의 PK -->
                        <form th:action="@{/checkin/{id}(id=${p.id})}" method="post" class="flex-grow-1">
                            <!-- [백엔드 필드] p.todayCheckedIn : 오늘 이미 체크인했는지 여부 (Boolean) -->
                            <button type="submit" class="btn btn-primary w-100" th:disabled="${p.todayCheckedIn}"> <!-- [역할] 사용자가 직접 사용을 기록하는 체크인 버튼 -->
                                <span th:text="${p.todayCheckedIn ? '오늘 체크인 완료' : '오늘 체크인!'}">오늘 체크인!</span>
                            </button>
                        </form>
                        <!-- [백엔드 API] GET /plans/{id} : p.plan.id는 SubscriptionPlan의 PK -->
                        <a th:href="@{/plans/{id}(id=${p.plan.id})}" class="btn btn-outline-secondary">상세보기</a> <!-- [역할] 상세 페이지 이동 버튼 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 토스트 알림 처리 -->
    <script th:inline="javascript" th:if="${successMessage != null}">
        /*<![CDATA[*/
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof window.showToast === 'function') {
                window.showToast(/*[[${successMessage}]]*/ '작업이 완료되었습니다.');
            }
        });
        /*]]>*/
    </script>
</section>
</body>
</html>
