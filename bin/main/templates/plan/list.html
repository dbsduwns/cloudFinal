<!DOCTYPE html>
<!-- 
    [프론트엔드 3] 플랜 목록 페이지
    - 가이드라인: layout.html 상속 필수
    - 핵심 요소: 체크인 버튼, 30칸 히트맵, 경보 배지
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>플랜 목록 - SubTrack</title>
</head>
<body>
<section class="content">
    <style>
        /* 레이아웃 구조 보정 Grid */
        .app-container {
            display: grid;
            grid-template-areas: 
                "sidebar header"
                "sidebar main"
                "sidebar footer";
            grid-template-columns: var(--sidebar-w) 1fr;
            grid-template-rows: var(--header-h) 1fr auto;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .site-header {
            grid-area: header;
            height: var(--header-h);
        }
        .site-nav {
            grid-area: sidebar;
            width: var(--sidebar-w);
        }
        .main-content {
            grid-area: main;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .site-footer {
            grid-area: footer;
        }
        
        /* plan-grid  */
        .plan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        /* 버튼 스타일 */
        .btn-outline-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-outline-secondary:hover {
            background: var(--bg-main);
        }
    </style>
    <div class="container">
        <header class="page-header mb-4"> <!-- [역할] 페이지 메인 제목 및 설명 영역 -->
            <h1>구독 플랜 목록</h1>
            <p>현재 구독 중인 서비스의 사용량을 관리하세요.</p>
        </header>

        <!-- 
            [백엔드 협의 필요]
            - Model Key: "plans" (List 자료형)
        -->
        <div class="plan-grid"> <!-- [역할] 플랜 카드들을 배치하는 그리드 컨테이너 -->
            <!-- plans가 비어있을 경우 처리 -->
            <div th:if="${#lists.isEmpty(plans)}" class="empty-state card p-5 text-center"> <!-- [역할] 데이터가 없을 때 표시되는 빈 화면 영역 -->
                <p>현재 구독 중인 플랜이 없습니다. 새로운 플랜을 찾아보세요!</p>
                <a href="/plans" class="btn btn-primary">플랜 둘러보기</a>
            </div>

            <!-- p: MemberSubscription 엔티티 또는 DTO 객체 -->
            <div th:each="p : ${plans}" class="plan-card card mb-3"> <!-- [역할] 개별 구독 정보를 담는 카드 단위 -->
                <div class="card-body">
                    <div class="plan-info d-flex justify-content-between align-items-start"> <!-- [역할] 카드 상단 정보(제목, 카테고리, 배지) 영역 -->
                        <div>
                            <!-- [백엔드 필드] p.plan.name : 서비스 명 (예: 넷플릭스) -->
                            <h2 class="h5 mb-1" th:text="${p.plan.name}">서비스 이름</h2> <!-- [역할] 서비스 명칭 제목 -->
                            <!-- [백엔드 필드] p.plan.category : 카테고리 (예: OTT, 음악) -->
                            <p class="text-muted small" th:text="${p.plan.category}">카테고리</p> <!-- [역할] 카테고리 텍스트 -->
                        </div>
                        
                        <!-- [백엔드 필드] p.alertLevel : 경보 단계 (NORMAL, WARNING, DANGER, CRITICAL) -->
                        <!-- 가이드라인: .badge-normal, .badge-warning 등의 클래스 사용 -->
                        <span class="badge" 
                              th:classappend="'badge-' + ${#strings.toLowerCase(p.alertLevel)}" 
                              th:text="${p.alertLevel}">NORMAL</span> <!-- [역할] 방치 경보 상태 표시 배지 -->
                    </div>
                    
                    <div class="heatmap-section my-3"> <!-- [역할] 히트맵 전체 섹션 (헤더+그리드) -->
                        <div class="heatmap-header d-flex justify-content-between mb-1"> <!-- [역할] 히트맵 상단 텍스트 및 카운트 정보 -->
                            <span class="small text-secondary">최근 30일 사용 현황</span>
                            <!-- [백엔드 필드] p.monthlyUsageCount : 최근 30일간 총 체크인 횟수 -->
                            <span class="usage-count badge badge-normal" th:text="${p.monthlyUsageCount} + '회 체크인'">0회 체크인</span> <!-- [역할] 총 체크인 횟수 표시 -->
                        </div>
                        
                        <!-- 가이드라인: .heatmap-grid 안에 30개의 .heat-box 생성 -->
                        <div class="heatmap-grid"> <!-- [역할] 30일 사용량을 보여주는 잔디(히트맵) 그리드 컨테이너 -->
                            <!-- [백엔드 필드] p.recentUsage : 30개의 Boolean 값을 가진 List/Array -->
                            <div th:each="used : ${p.recentUsage}" 
                                 class="heat-cell" 
                                 th:classappend="${used ? 'heat-green-3' : 'heat-gray'}"
                                 th:title="${used ? '사용함' : '미사용'}"> <!-- [역할] 개별 날짜의 사용 여부를 나타내는 사각형 칸 -->
                            </div>
                        </div>
                    </div>

                    <div class="plan-actions d-flex gap-2"> <!-- [역할] 하단 버튼 액션 영역 (체크인, 상세) -->
                        <!-- [백엔드 API] POST /checkin/{id} : p.id는 MemberSubscription의 PK -->
                        <form th:action="@{/checkin/{id}(id=${p.id})}" method="post" class="flex-grow-1">
                            <!-- [백엔드 필드] p.todayCheckedIn : 오늘 이미 체크인했는지 여부 (Boolean) -->
                            <button type="submit" class="btn btn-primary w-100" th:disabled="${p.todayCheckedIn}"> <!-- [역할] 사용자가 직접 사용을 기록하는 체크인 버튼 -->
                                <span th:text="${p.todayCheckedIn ? '오늘 체크인 완료' : '오늘 체크인!'}">오늘 체크인!</span>
                            </button>
                        </form>
                        <!-- [백엔드 API] GET /plans/{id} : p.plan.id는 SubscriptionPlan의 PK -->
                        <a th:href="@{/plans/{id}(id=${p.plan.id})}" class="btn btn-outline-secondary">상세보기</a> <!-- [역할] 상세 페이지 이동 버튼 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
