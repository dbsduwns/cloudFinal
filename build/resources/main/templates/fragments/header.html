<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<header th:fragment="header" class="header">
    <div class="header-left">
        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="구독 서비스 검색...">
        </div>
    </div>
    
    <div class="header-right">
        <div class="header-utilities">
            <i class="bi bi-question-circle" title="도움말"></i>
            <i class="bi bi-bell" title="알림"></i>
        </div>
        
        <div class="user-profile">
            <div class="user-info">
                <span class="user-name" th:text="${member != null ? member.name : '사용자'}">사용자</span>
                <span class="user-role" sec:authorize="isAuthenticated()" th:text="${#authentication.authorities[0]}">USER</span>
                <span class="user-role" sec:authorize="!isAuthenticated()">Guest</span>
            </div>
            <div class="user-avatar"></div>
        </div>
    </div>
</header>
</body>
</html>
