<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}"
      lang="ko">
<head>
    <title>대시보드 - SubTrack</title>
</head>
<body>
<section class="container">
    <div class="page-header page-header-row">
        <div>
            <p class="eyebrow">Dashboard</p>
            <h1 class="page-title">구독 대시보드</h1>
            <p class="page-subtitle">구독 현황과 최근 사용 패턴을 한눈에 확인하세요.</p>
        </div>
        <a th:href="@{/plans}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i>
            구독 추가
        </a>
    </div>

    <div class="stats-grid">
        <div class="card stat-card">
            <span class="stat-label">활성 구독</span>
            <span class="stat-value" th:text="${subscriptions != null ? #lists.size(subscriptions) : 0}">0</span>
        </div>
        <div class="card stat-card">
            <span class="stat-label">이번 달 체크인</span>
            <span class="stat-value"
                  th:text="${subscriptions != null ? #aggregates.sum(subscriptions.![monthlyCheckInCount]) : 0}">0</span>
        </div>
        <div class="card stat-card">
            <span class="stat-label">점검 필요</span>
            <span class="stat-value">2</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <section class="card dashboard-card">
            <div class="card-header">
                <h2 class="card-title">내 구독 현황</h2>
                <a th:href="@{/subscriptions}" class="text-link">전체보기</a>
            </div>

            <div th:if="${subscriptions == null || #lists.isEmpty(subscriptions)}" class="empty-state">
                <i class="bi bi-inbox"></i>
                <h3>구독 중인 서비스가 없습니다</h3>
                <p>첫 구독을 추가하고 사용 패턴을 기록해보세요.</p>
                <a th:href="@{/plans}" class="btn btn-primary">구독 추가하기</a>
            </div>

            <div th:if="${subscriptions != null && !#lists.isEmpty(subscriptions)}" class="recommend-card-list">
                <article th:each="sub : ${subscriptions}" class="recommend-item">
                    <div class="service-icon" th:text="${#strings.substring(sub.plan.name, 0, 1)}">S</div>
                    <div>
                        <h3 th:text="${sub.plan.name}">서비스명</h3>
                        <p>
                            이번 달 체크인
                            <strong th:text="${sub.monthlyCheckInCount}">0</strong>회
                            · 상태
                            <strong th:text="${sub.status}">ACTIVE</strong>
                        </p>
                    </div>
                </article>
            </div>
        </section>

        <aside class="card dashboard-card">
            <div class="card-header">
                <h2 class="card-title">방치 경보 & 추천</h2>
            </div>
            <div class="alert-strip level-warning">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>최근 사용 기록이 적은 구독은 해지 또는 대체 추천을 검토하세요.</span>
            </div>
            <div class="recommendation-main card mt-4">
                <span class="badge badge-primary">추천</span>
                <h3>대체 구독 추천</h3>
                <p class="text-muted">사용률이 낮은 구독을 기준으로 더 적합한 선택지를 찾아볼 수 있습니다.</p>
                <a th:href="@{/recommendation}" class="btn btn-outline mt-4">구독 추천 보기</a>
            </div>
        </aside>
    </div>
</section>
</body>
</html>
