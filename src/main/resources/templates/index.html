<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>대시보드 - SubDiary</title>
</head>
<body>
    <section class="dashboard-section">
        <div class="page-header">
            <h1 class="page-title">내 구독 대시보드</h1>
            <p class="page-subtitle">구독 현황과 사용량을 한눈에 확인하세요.</p>
        </div>

        <!-- Summary Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-primary"><i class="bi bi-layers-fill"></i></div>
                <div class="stat-info">
                    <span class="stat-label">활성 구독</span>
                    <span class="stat-value" th:text="${subscriptions != null ? #lists.size(subscriptions) : 0}">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-success"><i class="bi bi-calendar-check"></i></div>
                <div class="stat-info">
                    <span class="stat-label">이번 달 체크인</span>
                    <span class="stat-value">12회</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-warning"><i class="bi bi-exclamation-triangle-fill"></i></div>
                <div class="stat-info">
                    <span class="stat-label">방치된 구독</span>
                    <span class="stat-value">2개</span>
                </div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="dashboard-grid">
            <!-- Left: Subscription List (Summary) -->
            <div class="card dashboard-card">
                <div class="card-header">
                    <h3 class="card-title">내 구독 현황</h3>
                    <a th:href="@{/subscriptions}" class="btn-link">전체보기</a>
                </div>
                <div class="card-body">
                    <div th:if="${subscriptions == null || #lists.isEmpty(subscriptions)}" class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>구독 중인 서비스가 없습니다.</p>
                        <button class="btn btn-primary-sm">구독 추가하기</button>
                    </div>
                    <!-- Subscription items would go here -->
                </div>
            </div>

            <!-- Right: Alert / Recommendation -->
            <div class="card dashboard-card">
                <div class="card-header">
                    <h3 class="card-title">방치 경보 & 추천</h3>
                </div>
                <div class="card-body">
                    <div class="alert-item warning">
                        <div class="alert-icon"><i class="bi bi-alarm"></i></div>
                        <div class="alert-text">
                            <strong>넷플릭스</strong>를 14일간 사용하지 않았습니다.
                        </div>
                    </div>
                    <div class="recommend-box">
                        <p class="recommend-tag">AI 추천</p>
                        <h4 class="recommend-title">대체 구독 추천</h4>
                        <p class="recommend-desc">넷플릭스 대신 티빙(Tving)을 이용하면 월 5,000원을 아낄 수 있어요!</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
