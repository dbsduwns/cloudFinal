<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">SubTrack</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/assets/main.css}">
</head>
<body class="subtrack-theme">
    <div class="app-layout">
        <aside th:replace="~{fragments/nav :: nav}"></aside>

        <div class="main-container">
            <header th:replace="~{fragments/header :: header}"></header>

            <main class="content-body">
                <section th:replace="${content}"></section>
            </main>

            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>

        <nav class="mobile-bottom-nav" aria-label="모바일 메뉴">
            <a th:href="@{/}" class="mobile-nav-item">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>대시보드</span>
            </a>
            <a th:href="@{/subscriptions}" class="mobile-nav-item">
                <i class="bi bi-layers-fill"></i>
                <span>구독</span>
            </a>
            <button type="button" class="mobile-nav-checkin" onclick="openCheckInModal()" aria-label="오늘 사용 체크인">
                <i class="bi bi-check-lg"></i>
            </button>
            <a th:href="@{/member/usage-summary}" class="mobile-nav-item">
                <i class="bi bi-bar-chart-fill"></i>
                <span>통계</span>
            </a>
            <a th:href="@{/member/mypage}" class="mobile-nav-item">
                <i class="bi bi-person-fill"></i>
                <span>내정보</span>
            </a>
        </nav>
    </div>

    <div id="globalModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">알림</h3>
                <button type="button" class="btn-icon" onclick="closeModal()" aria-label="닫기">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body" id="modalContent"></div>
            <div class="modal-footer" id="modalFooter">
                <button type="button" class="btn btn-outline" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <script th:src="@{/assets/main.js}"></script>
</body>
</html>
