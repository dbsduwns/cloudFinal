<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:replace="${title}">SubDiary</title>
    
    <!-- Design System: Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- Build Assets (Vite) -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="subdiary-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation (Desktop) -->
        <aside th:replace="~{fragments/nav :: nav}"></aside>

        <div class="main-container">
            <!-- Top Header -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Page Content -->
            <main class="content-body">
                <section th:replace="${content}"></section>
            </main>

            <!-- Optional Footer (Desktop) -->
            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>

        <!-- [프론트엔드 1] 모바일 하단 내비게이션 (가이드 준수) -->
        <nav class="mobile-bottom-nav">
            <a th:href="@{/}" class="mobile-nav-item" th:classappend="${#httpServletRequest.requestURI == '/' ? 'active' : ''}">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>대시보드</span>
            </a>
            <a th:href="@{/subscriptions}" class="mobile-nav-item" th:classappend="${#httpServletRequest.requestURI == '/subscriptions' ? 'active' : ''}">
                <i class="bi bi-layers-fill"></i>
                <span>구독</span>
            </a>
            
            <!-- 중앙 체크인 버튼 -->
            <div class="mobile-nav-checkin" onclick="showToast('오늘의 체크인을 완료했습니다!', 'success')">
                <i class="bi bi-check-lg"></i>
            </div>

            <a th:href="@{/billing}" class="mobile-nav-item" th:classappend="${#httpServletRequest.requestURI == '/billing' ? 'active' : ''}">
                <i class="bi bi-credit-card-fill"></i>
                <span>결제</span>
            </a>
            <a th:href="@{/member/mypage}" class="mobile-nav-item" th:classappend="${#httpServletRequest.requestURI.startsWith('/member') ? 'active' : ''}">
                <i class="bi bi-person-fill"></i>
                <span>내정보</span>
            </a>
        </nav>
    </div>

    <!-- [프론트엔드 1] 공통 모달 기본 뼈대 -->
    <div id="globalModal" class="modal-overlay" onclick="closeModalByOverlay(event)">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">알림</h3>
                <button type="button" class="btn-close" onclick="closeModal('globalModal')">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body" id="modalContent"></div>
            <div class="modal-footer" id="modalFooter">
                <button type="button" class="btn btn-secondary-sm" onclick="closeModal('globalModal')">닫기</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
