<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">SubDiary</title>
    
    <!-- Design System: Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- Build Assets (Vite) -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="subdiary-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside th:replace="~{fragments/nav :: nav}"></aside>

        <div class="main-container">
            <!-- Top Header -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Page Content -->
            <main class="content-body">
                <section th:replace="${content}"></section>
            </main>

            <!-- Optional Footer -->
            <footer th:replace="~{fragments/footer :: footer}"></footer>
        </div>
    </div>

    <!-- [프론트엔드 1] 공통 모달 기본 뼈대 -->
    <div id="globalModal" class="modal-overlay" onclick="closeModalByOverlay(event)">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">알림</h3>
                <button type="button" class="btn-close" onclick="closeModal('globalModal')">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- 내용이 동적으로 삽입됩니다. -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <button type="button" class="btn btn-secondary-sm" onclick="closeModal('globalModal')">닫기</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
