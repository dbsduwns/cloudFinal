<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}"
      lang="ko">
<head>
    <title>로그인 - SubTrack</title>
</head>
<body>
<section class="container narrow-container">
    <div class="login-card card">
        <div class="page-header">
            <p class="eyebrow">Welcome Back</p>
            <h1 class="page-title">다시 만나서 반가워요</h1>
            <p class="page-subtitle">내 구독 현황과 사용 패턴을 이어서 관리하세요.</p>
        </div>

        <div class="notice error" th:if="${param.error}">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>이메일 또는 비밀번호가 올바르지 않습니다.</span>
        </div>

        <form th:action="@{/login}" method="post" class="stack-form">
            <label class="form-group" for="username">
                <span>이메일</span>
                <input type="email" id="username" name="username" placeholder="user@example.com" required autocomplete="email">
            </label>

            <label class="form-group" for="password">
                <span>비밀번호</span>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
            </label>

            <div class="login-options">
                <label class="form-check">
                    <input type="checkbox" name="remember-me" class="form-check-input">
                    <span>로그인 상태 유지</span>
                </label>
                <a th:href="@{/join}" class="text-link">회원가입</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full">로그인</button>
        </form>
    </div>
</section>
</body>
</html>
