<!DOCTYPE html>
<!-- 
    [프론트엔드 3] 구독 신청 폼 페이지
    - 가이드라인: layout.html 상속 필수
    - 핵심 요소: 시작일 선택, 약관 동의 체크박스, 선택된 플랜 정보 표시
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>구독 신청 - SubTrack</title>
</head>
<body>
<section class="content">
    <style>
        /* 레이아웃 구조 보정 Grid */
        .app-container {
            display: grid;
            grid-template-areas: 
                "sidebar header"
                "sidebar main"
                "sidebar footer";
            grid-template-columns: var(--sidebar-w) 1fr;
            grid-template-rows: var(--header-h) 1fr auto;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            
            --primary: #1A367E;
            --primary-dark: #142d6e;
            --primary-soft: rgba(26, 54, 126, 0.08);
            --card-shadow: 0 4px 32px rgba(26, 54, 126, 0.10);
            --radius-large: 16px;
            --radius-small: 10px;
            --bg-body: #F4F6FB;
        }
        .site-header {
            grid-area: header;
            height: var(--header-h);
        }
        .site-nav {
            grid-area: sidebar;
            width: var(--sidebar-w);
        }
        .main-content {
            grid-area: main;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--bg-body);
        }
        .site-footer {
            grid-area: footer;
        }

        .container {
            padding: 60px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--header-h) - 100px);
        }

        /* 폼 카드 프리미엄화 (login.html 참조) */
        .form-wrapper {
            background: #fff;
            border-radius: var(--radius-large);
            box-shadow: var(--card-shadow);
            border: none;
            padding: 48px 44px 40px;
            width: 100%;
            max-width: 540px;
        }

        .form-wrapper h1 {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* 선택된 플랜 요약 정보 고도화 */
        .selected-plan-info {
            background: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            border-radius: var(--radius-small);
            padding: 20px;
            margin-bottom: 28px;
        }
        .selected-plan-info h2 {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin-top: 2px;
            margin-bottom: 4px;
        }

        /* 폼 입력필드 프리미엄 스타일 */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #E2E8F0;
            background: #F8FAFC;
            border-radius: var(--radius-small);
            font-size: 14px;
            color: #111827;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
            box-sizing: border-box;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
            background-color: #fff;
        }

        /* 약관 동의 체크박스 */
        .terms-section {
            background: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            border-radius: var(--radius-small);
            padding: 16px;
            margin-bottom: 28px;
        }
        .form-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .form-check-input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin-top: 3px;
        }
        .form-check-label {
            color: #6B7A99;
            font-size: 13px;
            line-height: 1.4;
            cursor: pointer;
        }

        /* 버튼 및 폼 액션 */
        .btn {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-small);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-link {
            color: #6B7A99;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
    <div class="container">
        <div class="form-wrapper card">
            <h1>새로운 구독 등록</h1>
            
            <div class="form-content">
                <!-- 선택된 플랜 요약 정보 -->
                <div class="selected-plan-info mb-4 p-3 bg-light rounded"> <!-- [역할] 사용자가 선택한 플랜의 간략한 요약 정보 영역 -->
                    <p class="text-muted small mb-1">선택된 서비스</p>
                    <!-- [백엔드 필드] plan.name : 플랜 이름 -->
                    <h2 class="h5" th:text="${plan.name}">서비스 이름</h2>
                    <!-- [백엔드 필드] plan.monthlyPrice : 월 요금 -->
                    <p class="mb-0 text-primary font-weight-bold">
                        월 <span th:text="${#numbers.formatInteger(plan.monthlyPrice, 0, 'COMMA')}">0</span>원
                    </p>
                </div>

                <!-- 구독 신청 폼 -->
                <!-- [백엔드 API] POST /subscribe -->
                <form th:action="@{/subscribe}" method="post" class="subscription-form"> <!-- [역할] 실제 구독 데이터를 전송하는 폼 태그 -->
                    
                    <!-- [백엔드 필드] planId (Hidden) : 구독할 플랜의 PK -->
                    <input type="hidden" name="planId" th:value="${plan.id}">

                    <!-- 구독 시작일 입력 -->
                    <div class="form-group mb-3"> <!-- [역할] 입력 필드 그룹 (라벨 + 인풋) -->
                        <label for="startDate" class="form-label font-weight-bold">구독 시작일</label>
                        <!-- [백엔드 필드] startDate : 구독 시작 날짜 (HTML5 date 타입) -->
                        <input type="date" id="startDate" name="startDate" 
                               class="form-control" 
                               th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                               required> <!-- [역할] 사용자가 직접 날짜를 선택하는 입력창 -->
                        <small class="form-text text-muted">실제 서비스 결제가 시작된 날짜를 입력해주세요.</small>
                    </div>

                    <!-- 결제 예정일 (선택 입력) -->
                    <div class="form-group mb-4">
                        <label for="dueDate" class="form-label font-weight-bold">다음 결제 예정일 (선택)</label>
                        <!-- [백엔드 필드] dueDate : 다음 결제일 -->
                        <input type="date" id="dueDate" name="dueDate" class="form-control">
                        <small class="form-text text-muted">입력하시면 결제일 전에 알림을 보내드립니다.</small>
                    </div>

                    <hr>

                    <!-- 약관 동의 체크박스 (README 핵심 요소) -->
                    <div class="terms-section mb-4"> <!-- [역할] 약관 및 개인정보 동의 섹션 -->
                        <div class="form-check custom-checkbox">
                            <input type="checkbox" class="form-check-input" id="termsAgreement" required>
                            <label class="form-check-label small" for="termsAgreement">
                                (필수) 사용량 기반 체크인 알림 수신 및 데이터 분석 활용에 동의합니다.
                            </label> <!-- [역할] 가이드라인에 명시된 필수 동의 체크박스 -->
                        </div>
                    </div>

                    <!-- 폼 제출 버튼 -->
                    <div class="form-actions d-grid gap-2"> <!-- [역할] 폼 전송 및 취소 버튼 영역 -->
                        <button type="submit" class="btn btn-primary btn-lg">구독 시작하기</button> <!-- [역할] 구독 데이터를 서버로 전송하는 버튼 -->
                        <a href="javascript:history.back()" class="btn btn-link text-muted">취소하고 돌아가기</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
