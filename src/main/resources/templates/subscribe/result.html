<!--/*
  * [프론트엔드 3 - 구독 신청 결과 페이지 안내]
  * 
  * 1. 사용 백엔드 변수 (Model Key)
  *    - successMessage (String): 구독 신청 성공 시 노출되는 메시지
  *    - errorMessage (String): 구독 신청 실패 시 노출되는 에러 이유 설명 (성공 시 null)
  * 
  * 2. 주요 주의사항
  *    - 'errorMessage' 존재 유무에 따라 성공 결과 카드(그린 테마)와 실패 결과 카드(레드 테마)가 th:if 분기를 통해 깔끔하게 제어되어 렌더링되어야 합니다.
  */-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}"
      lang="ko">
<head>
    <title th:text="${errorMessage != null ? '구독 신청 실패 - SubTrack' : '구독 신청 완료 - SubTrack'}">구독 신청 결과 - SubTrack</title>
</head>
<body>
<section class="container narrow-container">
    <!-- 성공 케이스 -->
    <div th:if="${errorMessage == null}" class="result-card card">
        <div class="result-icon success" style="background: #E6F6EC; color: var(--success); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px auto;">
            <i class="bi bi-check2"></i>
        </div>
        <h1 class="page-title">구독 신청이 완료되었습니다</h1>
        <p class="page-subtitle" th:text="${successMessage != null ? successMessage : '내 구독 관리 화면에서 체크인과 히트맵을 확인할 수 있습니다.'}">
            내 구독 관리 화면에서 체크인과 히트맵을 확인할 수 있습니다.
        </p>
        <div class="result-actions">
            <a th:href="@{/subscriptions}" class="btn btn-primary">내 구독 보러가기</a>
            <a th:href="@{/plans}" class="btn btn-outline">다른 플랜 보기</a>
        </div>
    </div>

    <!-- 실패 케이스 -->
    <div th:if="${errorMessage != null}" class="result-card card">
        <div class="result-icon error" style="background: #FFEBEA; color: var(--danger); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px auto;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="page-title" style="color: var(--danger);">구독 신청에 실패하였습니다</h1>
        <p class="page-subtitle" th:text="${errorMessage}">
            이미 구독 중인 서비스이거나 올바르지 않은 요청입니다.
        </p>
        <div class="result-actions">
            <a th:href="@{/plans}" class="btn btn-primary" style="background-color: var(--danger); border-color: var(--danger);">플랜 목록으로</a>
            <a href="javascript:history.back()" class="btn btn-outline">이전 화면으로</a>
        </div>
    </div>
</section>
</body>
</html>
